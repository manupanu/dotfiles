# Kitty — practical, polished defaults
# Theme maintained by the official Rosé Pine kitty project.
include catppuccin-mocha.conf

#: Typography
font_family      Maple Mono NL NF
font_size        12.0
disable_ligatures cursor

#: A responsive cursor: beam at prompts via kitty shell integration, with a
#: subtle animated blink and a short trail for large cursor jumps.
cursor_shape                 beam
cursor_shape_unfocused       hollow
cursor_beam_thickness        1.5
cursor_blink_interval        0.6 ease-in-out
cursor_stop_blinking_after   15.0
cursor_trail                 50
cursor_trail_decay           0.10 0.30
cursor_trail_start_threshold 2
cursor_trail_color           #89b4fa

#: Scrolling, selection, and safe pasting
scrollback_lines               10000
scrollback_pager_history_size  128
scrollbar                      never
mouse_hide_wait                -1.0
strip_trailing_spaces          smart
paste_actions                  quote-urls-at-prompt,confirm,confirm-if-large

#: Focused pane workflow
enabled_layouts splits,stack
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+]     next_window
map ctrl+shift+[     previous_window

#: Quiet, comfortable window chrome
enable_audio_bell       no
visual_bell_duration    0.0
hide_window_decorations yes
window_padding_width    10
confirm_os_window_close -1
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2

#: Keep the useful prompt navigation, click-to-move, and URL quoting features.
shell_integration enabled
notify_on_cmd_finish invisible 5.0
