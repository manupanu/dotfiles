# Kitty — practical, polished defaults
include catppuccin-mocha.conf

#: Typography
font_family      Maple Mono Normal NL NF
font_size        14.0
disable_ligatures cursor

#: Transparency and background blur
background_opacity         0.85
background_blur            20
dynamic_background_opacity yes

#: A responsive cursor: beam at prompts via kitty shell integration, with a
#: subtle animated blink and a short trail for large cursor jumps.
cursor_shape                 beam
cursor_shape_unfocused       hollow
cursor_beam_thickness        1.5
cursor_blink_interval        0.6 ease-in-out
cursor_stop_blinking_after   15.0
cursor_trail                 50
cursor_trail_decay           0.10 0.30
cursor_trail_start_threshold 2
cursor_trail_color           #89b4fa

#: Scrolling, selection, and safe pasting
scrollback_lines               10000
scrollback_pager_history_size  128
scrollbar                      never
mouse_hide_wait                -1.0
strip_trailing_spaces          smart
paste_actions                  quote-urls-at-prompt,confirm,confirm-if-large

#: URL and hyperlink styling
url_style                      curly
underline_hyperlinks           hover

#: Focused pane workflow & window management
enabled_layouts                splits,stack
window_border_width            1pt
draw_minimal_borders           yes
inactive_text_alpha            -0.80

# Splits & pane creation (letter-based, avoids de_ch AltGr symbol keys)
map ctrl+shift+enter           launch --location=split --cwd=current
map ctrl+shift+d               launch --location=vsplit --cwd=current
map ctrl+shift+s               launch --location=hsplit --cwd=current

# Directional pane navigation (matches Hyprland arrow keys, avoids [] keys)
map ctrl+shift+left            neighboring_window left
map ctrl+shift+right           neighboring_window right
map ctrl+shift+up              neighboring_window up
map ctrl+shift+down            neighboring_window down

# Tab navigation (universal standard)
map ctrl+tab                   next_tab
map ctrl+shift+tab             previous_tab

# Zoom / stack layout toggle (supports both Z and Y for QWERTZ / QWERTY layout parity)
map ctrl+shift+z               toggle_layout stack
map ctrl+shift+y               toggle_layout stack

# Font size adjustments (de_ch friendly: '+' is Shift+1, so Ctrl+plus works without keypad)
map ctrl+plus                  change_font_size all +1.0
map ctrl+minus                 change_font_size all -1.0
map ctrl+0                     change_font_size all 0

# Configuration reload shortcuts
map ctrl+shift+f5              load_config_file

# macOS ergonomic bindings (Cmd key)
map cmd+enter                  launch --location=split --cwd=current
map cmd+d                      launch --location=vsplit --cwd=current
map cmd+shift+d                launch --location=hsplit --cwd=current
map cmd+alt+left               neighboring_window left
map cmd+alt+right              neighboring_window right
map cmd+alt+up                 neighboring_window up
map cmd+alt+down               neighboring_window down
map cmd+shift+z                toggle_layout stack
map cmd+shift+y                toggle_layout stack
map cmd+plus                   change_font_size all +1.0
map cmd+minus                  change_font_size all -1.0
map cmd+0                      change_font_size all 0
map cmd+ctrl+r                 load_config_file

#: macOS platform integration
macos_option_as_alt                left
macos_quit_when_last_window_closed yes
macos_show_window_title_in         none
macos_traditional_fullscreen       no

#: Quiet, comfortable window chrome & tabs
enable_audio_bell              no
visual_bell_duration           0.0
hide_window_decorations        titlebar-only
window_padding_width           12
placement_strategy             center
confirm_os_window_close        -1

tab_bar_style                  powerline
tab_powerline_style            slanted
tab_bar_min_tabs               2
tab_bar_background             none
active_tab_font_style          bold
inactive_tab_font_style        normal

#: Shell integration & notifications
shell_integration              enabled
notify_on_cmd_finish           invisible 5.0
