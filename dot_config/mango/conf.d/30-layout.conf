# Low-cost defaults that work on any output topology.
blur=1
blur_optimized=1
blur_layer=1
blur_params_num_passes=3
blur_params_radius=8
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.1
# slurp (screenshot region select) must stay see-through
layer_rule=no_blur:1,layer_name:selection
shadows=0
animations=1
animation_duration_move=350
animation_duration_open=280
animation_duration_tag=220
animation_duration_close=220
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=8
gap_outer_vertical=8
border_px=2
border_color=0x585b70ff
focus_color=0xf5c2e7ff
urgent_color=0xf38ba8ff
scratchpad_color=0x89b4faff
global_color=0xcba6f7ff
smart_gaps=1

# Opacity (100% solid windows, no transparency)
focused_opacity=1.0
unfocused_opacity=1.0

# Rounded corners
border_radius=8
no_radius_when_single=0

# Dwindle Layout (true bspwm-style binary split based on aspect ratio)
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=1
default_master_factor=0.55
default_master_count=1

# Tags default layout (dwindle by default on all tags)
tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle

# Window rules for applications and floating utilities

# Floating terminal
window_rule=is_floating:1,width:850,height:520,app_id:floating-terminal

# File manager (Thunar)
window_rule=is_floating:1,width:900,height:600,app_id:thunar
window_rule=is_floating:1,width:900,height:600,app_id:Thunar

# Media player (mpv)
window_rule=is_floating:1,app_id:mpv

# Screenshot annotator (Satty)
window_rule=is_floating:1,app_id:com.gabm.satty
window_rule=is_floating:1,app_id:org.satty.satty
window_rule=is_floating:1,app_id:satty

# Volume control
window_rule=is_floating:1,app_id:pavucontrol
window_rule=is_floating:1,app_id:org.pulseaudio.pavucontrol

# Bluetooth manager
window_rule=is_floating:1,app_id:blueman-manager
window_rule=is_floating:1,app_id:overskride

# Network settings
window_rule=is_floating:1,app_id:nm-connection-editor

# Display configurator
window_rule=is_floating:1,app_id:wdisplays

# GTK theme selector
window_rule=is_floating:1,app_id:nwg-look

# Image viewers
window_rule=is_floating:1,app_id:viewnior
window_rule=is_floating:1,app_id:Viewnior
window_rule=is_floating:1,app_id:feh
window_rule=is_floating:1,app_id:imv
window_rule=is_floating:1,app_id:swayimg
window_rule=is_floating:1,app_id:org.gnome.Loupe
window_rule=is_floating:1,app_id:eog
window_rule=is_floating:1,app_id:qView
window_rule=is_floating:1,app_id:qview

# PDF viewer (Zathura)
window_rule=is_floating:1,app_id:org.pwmt.zathura
window_rule=is_floating:1,app_id:zathura
