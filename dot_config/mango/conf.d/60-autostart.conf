# Apps that KDE started through ~/.config/autostart (mango does not read it).
exec_once=/opt/1Password/1password --silent
exec_once=/usr/bin/nextcloud --background
exec_once=/usr/bin/steam -silent
# Clipboard history (cliphist), text and images.
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store
# Tailscale: tailscaled is a systemd service (enabled, operator=manuel).
# Trayscale (flatpak) is the tray GUI; --hide-window keeps it in the tray.
exec_once=/usr/bin/flatpak run --branch=stable --arch=x86_64 --command=trayscale dev.deedles.Trayscale --hide-window
