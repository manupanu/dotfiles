# Window rules for my software stack. Find app ids with: mmsg get all-clients

# Firefox: Picture-in-Picture floats, stays on top, follows you across tags,
# sits small in the bottom-right corner and does not steal focus.
window_rule=is_floating:1,is_global:1,is_overlay:1,is_open_silent:1,width:889,height:500,offset_x:100,offset_y:100,no_force_center:0,app_id:^firefox$,title:^Picture-in-Picture$
# Firefox helper windows
window_rule=is_floating:1,width:900,height:650,app_id:^firefox$,title:^(Library|About Mozilla Firefox|Extension:.*|Page Info.*)$

# 1Password: main window floats, quick access / prompts float on top
window_rule=is_floating:1,width:1000,height:700,app_id:^1[Pp]assword$
window_rule=is_floating:1,is_overlay:1,app_id:^1[Pp]assword$,title:^Quick Access.*$

# Polkit authentication prompt
window_rule=is_floating:1,is_overlay:1,app_id:^polkit-gnome-authentication-agent-1$

# Steam: main window tiles; side windows and dialogs float. Games keep the
# screen awake while focused.
window_rule=is_floating:1,width:900,height:650,app_id:^steam$,title:^(Friends List|Steam Settings|Steam - News|Screenshot Uploader|Special Offers|Add a Game|Steam Guard.*|.*- Chat)$
window_rule=is_floating:1,width:500,height:300,app_id:^steam$,title:^(Sign in to Steam|Steam Dialog|Update News)$
window_rule=idle_inhibit_when_focus:1,app_id:^steam_app_.*$
window_rule=idle_inhibit_when_focus:1,app_id:^gamescope$

# Nextcloud and Tailscale GUIs
window_rule=is_floating:1,width:520,height:720,app_id:^com\.nextcloud\.desktopclient\.nextcloud$
window_rule=is_floating:1,width:900,height:600,app_id:^org\.fkoehler\.KTailctl$

# Utilities
window_rule=is_floating:1,width:900,height:600,app_id:^org\.gnome\.FileRoller$
window_rule=is_floating:1,width:800,height:600,app_id:^(xdg-desktop-portal-gtk|org\.freedesktop\.impl\.portal\.desktop\.gtk)$
window_rule=is_floating:1,width:700,height:500,app_id:^(org\.pwmt\.zathura-pdf-mupdf)$
window_rule=is_floating:1,app_id:^qt6ct$
window_rule=is_floating:1,app_id:^kvantummanager$

# Game launchers and Minecraft: floating dialogs, main windows tile
window_rule=is_floating:1,width:1000,height:700,app_id:^org\.prismlauncher\.PrismLauncher$,title:^(Settings|Preferences|Instance Settings.*|Edit Instance.*)$
