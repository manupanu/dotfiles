# Portable keyboard and pointer defaults. Device-specific input belongs in
# ../config.local.conf.
xkb_rules_layout=ch
repeat_rate=25
repeat_delay=600
trackpad_natural_scrolling=0
mouse_natural_scrolling=0
tap_to_click=1
tap_and_drag=1
trackpad_disable_while_typing=1
mouse_accel_profile=1
mouse_accel_speed=0.0
