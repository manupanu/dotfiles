# Session identity and one-shot orchestration.
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=GTK_THEME,adw-gtk3-dark
env=XCURSOR_THEME,Bibata-Modern-Ice
env=XCURSOR_SIZE,24
env=QT_QPA_PLATFORMTHEME,qt6ct

# Native Wayland hardware acceleration and zero-copy rendering
env=GDK_BACKEND,wayland,x11,*
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=MOZ_ENABLE_WAYLAND,1
env=ELECTRON_OZONE_PLATFORM_HINT,auto

# Xwayland on-demand (lazy) mode: run only when an X11 client connects
xwayland_persistence=0

exec_once=$HOME/.local/lib/mangowm/session-start
