### MangoHud Configuration
### Managed via dotfiles / chezmoi

################### HARDWARE MONITORING ###################

### GPU (Navi 32 / Radeon RX 7700/7800 XT)
gpu_stats
gpu_temp
# Uncomment to also display hotspot/junction temperature:
# gpu_junction_temp
gpu_core_clock
gpu_power
vram

### CPU (Ryzen 7 5700X3D)
cpu_stats
cpu_temp
cpu_mhz
# cpu_power
ram

################### FPS & FRAMETIME ###################

### Show FPS and frametime in milliseconds (numeric only)
fps
frametime=1

### Disable the visual frametime line graph & histogram
frame_timing=0
histogram=0

################### APPEARANCE ###################

position=top-left
round_corners=10
background_alpha=0.5
font_size=24
text_outline

################### SHORTCUTS ###################

### Press Right Shift + F12 to toggle MangoHud on/off in-game
toggle_hud=Shift_R+F12

### Press Left Shift + F4 to reload config while game is running
reload_cfg=Shift_L+F4
